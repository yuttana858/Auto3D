<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="content-type" content="text/html;charset=utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="assets/images/auto3d-mark.svg">

    <title>Auto3D | Browser 3D Viewer</title>

    <!-- meta start -->
    <!-- meta end -->

    <!-- website start -->
<link rel="stylesheet" href="o3dv/o3dv.website.min.css?v=0.20.2">
<script src="o3dv/o3dv.website.min.js?v=0.20.2"></script>
<!-- website end -->
    <!-- plugins start -->
    <!-- plugins end -->

    <!-- website analytics start -->
    <script type="text/javascript">
        OV.SetWebsiteEventHandler ((eventName, eventLabel, eventParams) => {
            console.log ({
                eventName : eventName,
                eventLabel : eventLabel,
                eventParams : eventParams
            });
        });
    </script>
    <!-- website analytics end -->

    <script type="text/javascript">
        OV.StartWebsite ();
    </script>

</head>

<body>
    <div id="startup_splash" class="startup_splash" role="status" aria-label="Loading Auto3D" style="position:fixed;inset:0;z-index:100000;background:#020305;color:#f6f8fb;">
        <canvas aria-hidden="true"></canvas>
        <div class="splash_identity">
            <svg class="splash_logo" viewBox="0 0 286 60" role="img" aria-label="SW Auto3D"><use href="assets/images/auto3d-logo.svg#logo"></use></svg>
            <p>Your 3D models. A whole new perspective.</p>
            <span class="splash_version"></span>
        </div>
    </div>
    <input type="file" id="open_file" style="display:none;" multiple></input>
    <div class="header" id="header">
        <div class="title">
            <div class="title_left">
                <a href="index.html">
                    <svg class="logo_image" viewBox="0 0 286 60"><use href="assets/images/auto3d-logo.svg?v=sw-auto3d#logo"></use></svg>
                </a>
            </div>
            <div class="title_right" id="header_buttons"></div>
            <div class="main_file_name only_full_width" id="main_file_name"></div>
        </div>
        <div class="toolbar" id="toolbar"></div>
    </div>
    <div class="main" id="main">
        <div class="main_left_container workspace_panel" id="main_left_container">
            <button class="workspace_panel_toggle" id="upload_panel_toggle" aria-expanded="true" aria-controls="upload_panel_content"><span>Model upload</span><span class="panel_chevron">‹</span></button>
            <div class="workspace_panel_body" id="upload_panel_content">
            <div id="upload_slot"></div>
            <details class="workspace_section" id="materials_section" open></details>
            <details class="workspace_section" id="lighting_section" open></details>
            <div class="main_navigator ov_panel_set_container" id="main_navigator"></div>
            </div>
            <div class="main_splitter" id="main_navigator_splitter"></div>
        </div>
        <div class="main_viewer" id="main_viewer">
            <svg id="world_axis" class="world_axis" viewBox="0 0 96 100" role="img" aria-label="World axis orientation: red X, green Y, blue Z"></svg>
            <div class="viewer_empty" id="viewer_empty"><svg viewBox="0 0 286 60"><use href="assets/images/auto3d-logo.svg?v=sw-auto3d#logo"></use></svg><h2>Model viewer</h2><p>Upload a model or choose a sample from the left panel.</p></div>
        </div>
        <div class="main_right_container workspace_panel" id="main_right_container">
            <button class="workspace_panel_toggle" id="data_panel_toggle" aria-expanded="true" aria-controls="data_panel_content"><span>Model data</span><span class="panel_chevron">›</span></button>
            <div class="workspace_panel_body" id="data_panel_content">
            <div class="main_splitter" id="main_sidebar_splitter"></div>
            <div class="main_sidebar ov_panel_set_right_container" id="main_sidebar"></div>
            </div>
        </div>
    </div>
    <section id="material_drawer" class="material_drawer" role="region" aria-label="Advanced material editor" inert>
        <div class="drawer_header"><div><strong>Advanced material editor</strong><span id="material_drawer_context"></span></div><button id="material_drawer_close" aria-label="Close material editor">×</button></div>
        <div id="material_drawer_content" class="drawer_content"></div>
    </section>
    <div class="intro ov_thin_scrollbar" id="intro">
        <div class="intro_content" id="intro_content">
            <div class="intro_logo">
                <div class="intro_dragdrop_text" id="intro_dragdrop_text"></div>
                <button class="workspace_upload_button" id="workspace_upload">Upload model</button>
                <button class="workspace_url_button" id="workspace_open_url">Open model URL</button>
            </div>
            <p class="workspace_upload_hint">Model format is detected automatically. Include any related material and texture files.</p>
            <a class="workspace_url_button" href="#model=assets/models/utah_teapot.stl">Load sample model</a>
            <!-- intro footer start -->
            <!-- intro footer end -->
        </div>
    </div>
</body>

</html>
