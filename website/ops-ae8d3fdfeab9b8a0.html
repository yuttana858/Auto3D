<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>Auto3D Administration</title>
    <style>
        :root { color-scheme: dark; font-family: Arial, sans-serif; background:#07111b; color:#edf4ff; }
        body { margin:0; background:#07111b; }
        main { max-width:1100px; margin:0 auto; padding:32px 20px 64px; }
        header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:28px; }
        h1 { margin:0; font-size:28px; } h2 { margin:0 0 14px; font-size:18px; }
        .muted { color:#8ea6bb; font-size:13px; }
        .panel { background:#0b1723; border:1px solid #253a4d; border-radius:10px; padding:18px; margin-bottom:18px; }
        .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
        input, select, textarea, button { font:inherit; }
        input, select, textarea { box-sizing:border-box; width:100%; background:#07111b; border:1px solid #31516a; color:#edf4ff; border-radius:6px; padding:9px 10px; }
        button { border:1px solid #3b657f; border-radius:6px; background:#102538; color:#dcecff; padding:8px 12px; cursor:pointer; }
        button.primary { background:#65c4ee; color:#071421; border-color:#65c4ee; font-weight:700; }
        button.danger { border-color:#7c3c45; color:#ffb4bc; }
        table { width:100%; border-collapse:collapse; font-size:13px; }
        th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #1e3243; vertical-align:top; }
        th { color:#8fb1c9; font-size:11px; letter-spacing:.05em; text-transform:uppercase; }
        .actions { display:flex; flex-wrap:wrap; gap:7px; }
        .status { min-height:20px; color:#74c5e5; font-size:13px; }
        .temp { padding:10px; border:1px solid #705b23; background:#231f0f; color:#ffe89d; border-radius:6px; margin-top:10px; word-break:break-all; }
        @media(max-width:760px){ .grid{grid-template-columns:1fr;} header{align-items:flex-start;flex-direction:column;} table{display:block;overflow:auto;} }
    </style>
</head>
<body>
<main>
    <header>
        <div><h1>Auto3D Administration</h1><div class="muted">User access, approvals, and temporary credentials</div></div>
        <button id="refresh">Refresh</button>
    </header>
    <div id="status" class="status"></div>
    <section class="panel">
        <h2>Create user manually</h2>
        <div class="grid">
            <input id="new_name" placeholder="Display name">
            <input id="new_email" type="email" placeholder="Email">
            <input id="new_password" type="password" placeholder="Temporary password (optional)">
            <label><input id="new_admin" type="checkbox" style="width:auto"> Platform admin</label>
        </div>
        <div style="margin-top:12px"><button class="primary" id="create_user">Create user</button></div>
        <div id="created_password"></div>
    </section>
    <section class="panel">
        <h2>Access requests</h2>
        <table><thead><tr><th>User</th><th>Organization</th><th>Message</th><th>Status</th><th>Actions</th></tr></thead><tbody id="requests"></tbody></table>
    </section>
    <section class="panel">
        <h2>Users</h2>
        <table><thead><tr><th>User</th><th>Status</th><th>Admin</th><th>Created</th><th>Actions</th></tr></thead><tbody id="users"></tbody></table>
    </section>
</main>
<script>
const statusEl = document.getElementById('status');
const requestRows = document.getElementById('requests');
const userRows = document.getElementById('users');
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path='', options={}) {
  const response = await fetch('/api/admin/' + path, {credentials:'same-origin', ...options, headers:{'Content-Type':'application/json', ...(options.headers||{})}});
  const data = await response.json().catch(()=>({}));
  if (!response.ok) throw new Error(data.error || 'Admin request failed.');
  return data;
}
function showTemp(password) {
  document.getElementById('created_password').innerHTML = password ? '<div class="temp"><strong>Temporary password — copy now:</strong><br>' + esc(password) + '</div>' : '';
}
async function load() {
  statusEl.textContent='Loading…';
  try {
    const data = await api('');
    requestRows.innerHTML = data.requests.map(r => '<tr><td><strong>'+esc(r.display_name||'')+'</strong><br>'+esc(r.email)+'</td><td>'+esc(r.organization_name||'')+'</td><td>'+esc(r.message||'')+'</td><td>'+esc(r.status)+'</td><td><div class="actions">'+(r.status==='pending'?'<button class="primary" data-approve="'+esc(r.id)+'" data-email="'+esc(r.email)+'" data-name="'+esc(r.display_name||'')+'">Approve</button><button data-decline="'+esc(r.id)+'">Decline</button>':'')+'</div></td></tr>').join('');
    userRows.innerHTML = data.users.map(u => '<tr><td><strong>'+esc(u.display_name||'')+'</strong><br>'+esc(u.email)+'</td><td>'+esc(u.status)+'</td><td>'+(u.is_platform_admin?'Yes':'No')+'</td><td>'+esc(new Date(u.created_at).toLocaleString())+'</td><td><button class="danger" data-delete="'+esc(u.id)+'">Delete</button></td></tr>').join('');
    statusEl.textContent='Signed in as '+(data.admin.display_name||data.admin.email);
  } catch (error) {
    statusEl.textContent=error.message;
    requestRows.innerHTML=''; userRows.innerHTML='';
  }
}
document.getElementById('refresh').onclick=load;
document.getElementById('create_user').onclick=async()=>{
  try {
    const data = await api('users',{method:'POST',body:JSON.stringify({
      displayName:document.getElementById('new_name').value.trim(),
      email:document.getElementById('new_email').value.trim(),
      password:document.getElementById('new_password').value,
      platformAdmin:document.getElementById('new_admin').checked
    })});
    showTemp(data.temporaryPassword); await load();
  } catch(error){ statusEl.textContent=error.message; }
};
document.addEventListener('click', async (event)=>{
  const a=event.target.closest('[data-approve]'); if(a){
    try { const data=await api('approve',{method:'POST',body:JSON.stringify({requestId:a.dataset.approve,email:a.dataset.email,displayName:a.dataset.name})}); showTemp(data.temporaryPassword); await load(); } catch(error){ statusEl.textContent=error.message; }
    return;
  }
  const d=event.target.closest('[data-decline]'); if(d){
    try { await api('decline',{method:'POST',body:JSON.stringify({requestId:d.dataset.decline})}); await load(); } catch(error){ statusEl.textContent=error.message; }
    return;
  }
  const del=event.target.closest('[data-delete]'); if(del && confirm('Delete this Auto3D user?')){
    try { await api('users/'+encodeURIComponent(del.dataset.delete),{method:'DELETE'}); await load(); } catch(error){ statusEl.textContent=error.message; }
  }
});
load();
</script>
</body>
</html>
