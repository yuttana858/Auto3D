<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>Auto3D Administration</title>
    <style>
        :root { color-scheme: dark; font-family: Arial, sans-serif; background:#07111b; color:#edf4ff; }
        body { margin:0; background:#07111b; }
        main { max-width:1180px; margin:0 auto; padding:32px 20px 64px; }
        header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:28px; }
        h1 { margin:0; font-size:28px; } h2 { margin:0 0 14px; font-size:18px; }
        .muted { color:#8ea6bb; font-size:13px; }
        .panel { background:#0b1723; border:1px solid #253a4d; border-radius:10px; padding:18px; margin-bottom:18px; }
        .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 18px; }
        input, select, textarea, button { font:inherit; }
        input, select, textarea { box-sizing:border-box; width:100%; background:#07111b; border:1px solid #31516a; color:#edf4ff; border-radius:6px; padding:9px 10px; }
        label { display:flex; align-items:center; gap:8px; color:#c3d4e1; font-size:13px; }
        button { border:1px solid #3b657f; border-radius:6px; background:#102538; color:#dcecff; padding:8px 12px; cursor:pointer; }
        button.primary { background:#65c4ee; color:#071421; border-color:#65c4ee; font-weight:700; }
        button.danger { border-color:#7c3c45; color:#ffb4bc; }
        button.warn { border-color:#7a6534; color:#ffe1a0; }
        table { width:100%; border-collapse:collapse; font-size:13px; }
        th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #1e3243; vertical-align:top; }
        th { color:#8fb1c9; font-size:11px; letter-spacing:.05em; text-transform:uppercase; }
        .actions { display:flex; flex-wrap:wrap; gap:7px; }
        .status { min-height:20px; color:#74c5e5; font-size:13px; margin-bottom:10px; }
        .temp { padding:10px; border:1px solid #705b23; background:#231f0f; color:#ffe89d; border-radius:6px; margin-top:10px; word-break:break-all; }
        .row-controls { display:grid; grid-template-columns:minmax(120px,1fr) minmax(90px,.7fr); gap:6px; margin-bottom:7px; }
        .pill { display:inline-block; padding:2px 7px; border:1px solid #36556d; border-radius:999px; color:#b9d7e8; font-size:11px; }
        @media(max-width:760px){ .grid{grid-template-columns:1fr;} header{align-items:flex-start;flex-direction:column;} table{display:block;overflow:auto;} .row-controls{grid-template-columns:1fr;} }
    </style>
</head>
<body>
<main>
    <header>
        <div><h1>Auto3D Administration</h1><div class="muted">User access, organizations, roles, and temporary credentials</div></div>
        <button id="refresh">Refresh</button>
    </header>
    <div id="status" class="status"></div>

    <section class="panel">
        <h2>Create organization</h2>
        <div class="grid">
            <input id="org_name" placeholder="Organization name">
            <input id="org_slug" placeholder="Slug (optional)">
        </div>
        <div style="margin-top:12px"><button class="primary" id="create_org">Create organization</button></div>
    </section>

    <section class="panel">
        <h2>Create user manually</h2>
        <div class="grid">
            <input id="new_name" placeholder="Display name">
            <input id="new_email" type="email" placeholder="Email">
            <input id="new_password" type="password" placeholder="Temporary password (optional)">
            <select id="new_org"></select>
            <select id="new_role">
                <option value="viewer">Viewer</option>
                <option value="editor">Editor</option>
                <option value="admin">Admin</option>
                <option value="owner">Owner</option>
            </select>
            <label><input id="new_admin" type="checkbox" style="width:auto"> Platform admin</label>
        </div>
        <div style="margin-top:12px"><button class="primary" id="create_user">Create user</button></div>
        <div id="created_password"></div>
    </section>

    <section class="panel">
        <h2>Access requests</h2>
        <table>
            <thead><tr><th>User</th><th>Requested org</th><th>Message</th><th>Status</th><th>Approve as</th><th>Actions</th></tr></thead>
            <tbody id="requests"></tbody>
        </table>
    </section>

    <section class="panel">
        <h2>Users</h2>
        <table>
            <thead><tr><th>User</th><th>Status</th><th>Platform admin</th><th>Organization / role</th><th>Created</th><th>Actions</th></tr></thead>
            <tbody id="users"></tbody>
        </table>
    </section>
</main>
<script>
const statusEl = document.getElementById('status');
const requestRows = document.getElementById('requests');
const userRows = document.getElementById('users');
let state = { requests:[], users:[], organizations:[], memberships:[], admin:null };
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path='', options={}) {
  const response = await fetch('/api/admin/' + path, {
    credentials:'same-origin',
    ...options,
    headers:{'Content-Type':'application/json', ...(options.headers||{})}
  });
  const data = await response.json().catch(()=>({}));
  if (!response.ok) throw new Error(data.error || 'Admin request failed.');
  return data;
}

function orgOptions(selected='') {
  return '<option value="">No organization</option>' + state.organizations
    .filter(o => o.status === 'active')
    .map(o => '<option value="'+esc(o.id)+'" '+(o.id===selected?'selected':'')+'>'+esc(o.name)+'</option>')
    .join('');
}
function roleOptions(selected='viewer') {
  return ['viewer','editor','admin','owner'].map(r => '<option value="'+r+'" '+(r===selected?'selected':'')+'>'+r[0].toUpperCase()+r.slice(1)+'</option>').join('');
}
function membershipFor(userId) {
  return state.memberships.find(m => m.user_id === userId && m.status === 'active') || null;
}
function showTemp(password) {
  document.getElementById('created_password').innerHTML = password
    ? '<div class="temp"><strong>Temporary password — copy now:</strong><br>'+esc(password)+'</div>' : '';
}
function render() {
  document.getElementById('new_org').innerHTML = orgOptions('');

  requestRows.innerHTML = state.requests.map(r => {
    const pending = r.status === 'pending';
    return '<tr>'+
      '<td><strong>'+esc(r.display_name||'')+'</strong><br>'+esc(r.email)+'</td>'+
      '<td>'+esc(r.organization_name||'')+'</td>'+
      '<td>'+esc(r.message||'')+'</td>'+
      '<td><span class="pill">'+esc(r.status)+'</span></td>'+
      '<td>'+(pending?'<div class="row-controls"><select data-request-org="'+esc(r.id)+'">'+orgOptions('')+'</select><select data-request-role="'+esc(r.id)+'">'+roleOptions('viewer')+'</select></div>':'')+'</td>'+
      '<td><div class="actions">'+(pending?
        '<button class="primary" data-approve="'+esc(r.id)+'" data-email="'+esc(r.email)+'" data-name="'+esc(r.display_name||'')+'">Approve</button>'+
        '<button data-decline="'+esc(r.id)+'">Decline</button>':'')+
      '</div></td></tr>';
  }).join('');

  userRows.innerHTML = state.users.map(u => {
    const membership = membershipFor(u.id);
    const org = membership ? state.organizations.find(o => o.id === membership.organization_id) : null;
    const isSelf = state.admin && u.id === state.admin.id;
    return '<tr>'+
      '<td><strong>'+esc(u.display_name||'')+'</strong><br>'+esc(u.email)+'</td>'+
      '<td><span class="pill">'+esc(u.status)+'</span></td>'+
      '<td>'+ (u.is_platform_admin?'Yes':'No') +'</td>'+
      '<td><div class="row-controls">'+
        '<select data-user-org="'+esc(u.id)+'">'+orgOptions(org?.id||'')+'</select>'+
        '<select data-user-role="'+esc(u.id)+'">'+roleOptions(membership?.role||'viewer')+'</select>'+
      '</div></td>'+
      '<td>'+esc(new Date(u.created_at).toLocaleString())+'</td>'+
      '<td><div class="actions">'+
        '<button data-save-user="'+esc(u.id)+'">Save role</button>'+
        '<button class="warn" data-toggle-user="'+esc(u.id)+'" data-next-status="'+(u.status==='active'?'disabled':'active')+'" '+(isSelf?'disabled':'')+'>'+(u.status==='active'?'Disable':'Activate')+'</button>'+
        '<button data-toggle-admin="'+esc(u.id)+'" data-next-admin="'+(!u.is_platform_admin)+'" '+(isSelf&&u.is_platform_admin?'disabled':'')+'>'+(u.is_platform_admin?'Remove admin':'Make admin')+'</button>'+
        '<button data-reset="'+esc(u.id)+'">Reset password</button>'+
        '<button class="danger" data-delete="'+esc(u.id)+'" '+(isSelf?'disabled':'')+'>Delete</button>'+
      '</div></td></tr>';
  }).join('');
}
async function load() {
  statusEl.textContent='Loading…';
  try {
    state = await api('');
    render();
    statusEl.textContent='Signed in as '+(state.admin.display_name||state.admin.email);
  } catch (error) {
    statusEl.textContent=error.message;
    requestRows.innerHTML=''; userRows.innerHTML='';
  }
}
document.getElementById('refresh').onclick=load;

document.getElementById('create_org').onclick=async()=>{
  try {
    await api('organizations',{method:'POST',body:JSON.stringify({
      name:document.getElementById('org_name').value.trim(),
      slug:document.getElementById('org_slug').value.trim()
    })});
    document.getElementById('org_name').value='';
    document.getElementById('org_slug').value='';
    await load();
  } catch(error){ statusEl.textContent=error.message; }
};

document.getElementById('create_user').onclick=async()=>{
  try {
    const data = await api('users',{method:'POST',body:JSON.stringify({
      displayName:document.getElementById('new_name').value.trim(),
      email:document.getElementById('new_email').value.trim(),
      password:document.getElementById('new_password').value,
      organizationId:document.getElementById('new_org').value,
      role:document.getElementById('new_role').value,
      platformAdmin:document.getElementById('new_admin').checked
    })});
    showTemp(data.temporaryPassword);
    await load();
  } catch(error){ statusEl.textContent=error.message; }
};

document.addEventListener('click', async (event)=>{
  const a=event.target.closest('[data-approve]');
  if(a){
    const id=a.dataset.approve;
    const org=document.querySelector('[data-request-org="'+CSS.escape(id)+'"]').value;
    const role=document.querySelector('[data-request-role="'+CSS.escape(id)+'"]').value;
    try {
      const data=await api('approve',{method:'POST',body:JSON.stringify({
        requestId:id,email:a.dataset.email,displayName:a.dataset.name,organizationId:org,role
      })});
      showTemp(data.temporaryPassword); await load();
    } catch(error){ statusEl.textContent=error.message; }
    return;
  }

  const d=event.target.closest('[data-decline]');
  if(d){
    try { await api('decline',{method:'POST',body:JSON.stringify({requestId:d.dataset.decline})}); await load(); }
    catch(error){ statusEl.textContent=error.message; }
    return;
  }

  const save=event.target.closest('[data-save-user]');
  if(save){
    const id=save.dataset.saveUser;
    const org=document.querySelector('[data-user-org="'+CSS.escape(id)+'"]').value;
    const role=document.querySelector('[data-user-role="'+CSS.escape(id)+'"]').value;
    try { await api('users/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({organizationId:org,role})}); await load(); }
    catch(error){ statusEl.textContent=error.message; }
    return;
  }

  const toggle=event.target.closest('[data-toggle-user]');
  if(toggle){
    try { await api('users/'+encodeURIComponent(toggle.dataset.toggleUser),{method:'PATCH',body:JSON.stringify({status:toggle.dataset.nextStatus})}); await load(); }
    catch(error){ statusEl.textContent=error.message; }
    return;
  }

  const admin=event.target.closest('[data-toggle-admin]');
  if(admin){
    try { await api('users/'+encodeURIComponent(admin.dataset.toggleAdmin),{method:'PATCH',body:JSON.stringify({platformAdmin:admin.dataset.nextAdmin==='true'})}); await load(); }
    catch(error){ statusEl.textContent=error.message; }
    return;
  }

  const reset=event.target.closest('[data-reset]');
  if(reset && confirm('Generate a new temporary password for this user?')){
    try { const data=await api('users/'+encodeURIComponent(reset.dataset.reset)+'/reset-password',{method:'POST'}); showTemp(data.temporaryPassword); }
    catch(error){ statusEl.textContent=error.message; }
    return;
  }

  const del=event.target.closest('[data-delete]');
  if(del && confirm('Delete this Auto3D authentication account and mark the user record deleted?')){
    try { await api('users/'+encodeURIComponent(del.dataset.delete),{method:'DELETE'}); await load(); }
    catch(error){ statusEl.textContent=error.message; }
  }
});
load();
</script>
</body>
</html>
