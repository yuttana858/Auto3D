name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  # A half-finished deploy can leave the MCP broker and Pages app on different versions; queue instead.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run lint_mcp
      - run: npm run check_licenses
      - run: npm run audit_prod
      - run: npm test
      - run: npm run test_mcp
      - name: Verify audience-sharing database permissions and throttling
        shell: bash
        run: |
          set -euo pipefail
          for script in test/security/audience-bootstrap.sql supabase/migrations/20261020223655_audience_library_sharing.sql test/security/audience-access.sql; do
            docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -v ON_ERROR_STOP=1 < "$script"
          done
      - run: npm --prefix backend test
      - run: npm run build_website
      - run: node tools/build_pages.mjs
      - run: node tools/check_mcp_licenses.mjs build/pages/MCP-LICENSES.txt
      - name: Deploy configured private live MCP broker
        id: mcp_broker
        run: node tools/deploy_live_mcp_broker.mjs

      - name: Ensure Cloudflare Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4.146.0 pages project list | grep -Eq '(^|[[:space:]])auto3d([[:space:]]|$)'; then
            npx --yes wrangler@4.146.0 pages project create auto3d --production-branch=main
          fi

      - name: Deploy Auto3D
        run: >
          npx --yes wrangler@4.146.0 pages deploy build/pages
          --project-name=auto3d
          --branch=main
          --commit-hash="${GITHUB_SHA}"

      - name: Verify deployed version and bundle
        run: node tools/verify_deployment.mjs https://auto3d-5av.pages.dev "${GITHUB_SHA}"
      - name: Verify animated landing and existing login routes
        run: node tools/verify_landing_deployment.mjs https://auto3d-5av.pages.dev
      - name: Verify Meshy UI and credential authentication boundary
        run: node tools/verify_meshy_deployment.mjs https://auto3d-5av.pages.dev
      - name: Verify live MCP discovery and authentication boundary
        if: steps.mcp_broker.outputs.enabled == 'true'
        run: node tools/verify_live_mcp.mjs
