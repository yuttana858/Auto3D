name: Validate build refresh

on:
  push:
    branches:
      - build-refresh

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check_licenses
      - run: npm run audit_prod
      - run: npm test
      - run: npm --prefix backend test
      - run: npm run build_engine
      - run: npm run build_engine_module
      - run: npm run build_website
