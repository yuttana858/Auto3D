name: Sync command catalog

on:
  push:
    branches:
      - ux-share-update

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-share-update
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build_command_catalog
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/assets/commands.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync agent command catalog"
          git push origin HEAD:ux-share-update
