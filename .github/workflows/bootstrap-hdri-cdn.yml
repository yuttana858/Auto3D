name: Bootstrap HDRI CDN assets

on:
  push:
    branches:
      - scene-interaction-v025

permissions:
  contents: read

jobs:
  upload:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Upload current 1K HDRI preview tier and thumbnails
        shell: bash
        run: |
          set -euo pipefail
          API_FILE='functions/api/library/[[path]].js'
          SUPABASE_URL=$(sed -n "s/^const DefaultSupabaseUrl = '\([^']*\)';/\1/p" "$API_FILE")
          SUPABASE_KEY=$(sed -n "s/^const DefaultPublishableKey = '\([^']*\)';/\1/p" "$API_FILE")
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          for hdr in website/assets/hdri/*.hdr; do
            id=$(basename "$hdr" .hdr)
            curl --fail-with-body --retry 3 \
              -X POST "$SUPABASE_URL/storage/v1/object/auto3d-hdri/preview/$id.hdr" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Content-Type: application/octet-stream" \
              -H "Cache-Control: 31536000" \
              -H "x-upsert: false" \
              --data-binary "@$hdr"
          done
          for png in website/assets/hdri/*.png; do
            id=$(basename "$png" .png)
            curl --fail-with-body --retry 3 \
              -X POST "$SUPABASE_URL/storage/v1/object/auto3d-hdri/thumb/$id.png" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Content-Type: image/png" \
              -H "Cache-Control: 31536000" \
              -H "x-upsert: false" \
              --data-binary "@$png"
          done
