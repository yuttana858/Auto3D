name: Verify isolated MCP pilot

# CI already covers lint, units, MCP, isolated packaging and browser access/consent.
# Run this only when a downloadable isolated pilot candidate is actually needed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run lint_mcp
      - run: npm run check_licenses
      - run: npm test
      - run: npm run test_mcp
      - run: npm run build_mcp_pilot
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node test/browser/mcp-access.mjs
      - run: node test/browser/mcp-consent.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: auto3d-mcp-staging-candidate
          path: |
            build/mcp-pilot
            build/mcp-workers
          retention-days: 1

# This workflow deliberately has no deployment job or production credentials.
# Live staging requires the isolated identity project and pilot allowlist first.
