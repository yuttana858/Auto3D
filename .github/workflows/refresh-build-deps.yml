name: Refresh build dependencies

on:
  push:
    branches:
      - build-refresh

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh compatible build dependencies
        run: >
          npm install --save-dev
          @types/node@22
          esbuild@0.28
          eslint@8
          eslint-plugin-unused-imports@4
          jsdoc@4
          mocha@11
          rollup@4
          svgo@3
          typescript@5
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh compatible build dependencies"
          git push origin HEAD:build-refresh
