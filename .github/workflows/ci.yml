name: CI

# Ready PRs run validation plus the quick browser smoke suite (test/browser/smoke-suite.txt).
# The full browser suite (test/browser/ci-suite.txt, three shards) runs only when asked:
#   - add the "full-ci" label to a ready PR (do this once, right before merging a release batch), or
#   - Actions -> CI -> Run workflow, suite "full" (the default for manual runs).
# Draft PRs run nothing. See docs/actions-cost-control.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled]
  workflow_dispatch:
    inputs:
      suite:
        description: Browser suite to run
        type: choice
        options: [full, smoke]
        default: full

permissions:
  contents: read

concurrency:
  # Adding an unrelated label must not cancel a run in progress, so those events get their own group.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check_licenses
      - run: npm run audit_prod
      - run: npm test
      - run: npm run lint_mcp
      - run: npm run test_mcp
      - run: node test/modal-worker.mjs
      - name: Committed MCP command catalog matches the registry
        run: git diff --exit-code mcp/command-catalog.js website/assets/commands.json
      - name: Verify audience-sharing database permissions and throttling
        shell: bash
        run: |
          set -euo pipefail
          for script in test/security/audience-bootstrap.sql supabase/migrations/20261020223655_audience_library_sharing.sql test/security/audience-access.sql; do
            docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -v ON_ERROR_STOP=1 < "$script"
          done
      - name: Verify Messenger database membership and browser isolation
        shell: bash
        run: |
          set -euo pipefail
          docker exec '${{ job.services.postgres.id }}' createdb -U postgres messenger_test
          for script in test/security/messenger-bootstrap.sql supabase/migrations/20261115133848_messenger_conversations.sql test/security/messenger-access.sql; do
            docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d messenger_test -v ON_ERROR_STOP=1 < "$script"
          done
      - run: npm --prefix backend test
      - run: npm run build_engine
      - run: npm run build_engine_module
      - run: npm run build_website
      - name: Verify isolated MCP pilot packaging without a duplicate validation job
        run: |
          node tools/build_pages.mjs
          node tools/build_mcp_pilot.mjs
          node tools/check_mcp_licenses.mjs build/mcp-pilot/MCP-LICENSES.txt

  browser:
    # Do not allocate browser runners when validation already fails.
    needs: validate
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    name: browser (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: true
      matrix:
        # Full: three parallel shards (shorter wait, same total minutes). Smoke: one job.
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.suite == 'full') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) && '[{"suite":"full","shard":1,"shards":3},{"suite":"full","shard":2,"shards":3},{"suite":"full","shard":3,"shards":3}]' || '[{"suite":"smoke","shard":1,"shards":1}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache the Playwright Chromium download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright-core install --with-deps chromium
      - name: Expose Chromium where the browser tests expect it
        run: sudo ln -sf "$(node -e "console.log(require('playwright-core').chromium.executablePath())")" /usr/bin/chromium
      - name: Build the dev site, production site, Pages output and MCP workers the regressions load
        run: |
          npm run build_dev
          npm run build_website
          node tools/build_pages.mjs
          node tools/build_mcp_workers.mjs
      - name: Run browser regressions
        shell: bash
        run: |
          npm start > dev-server.log 2>&1 &
          npm run preview_packaging > packaging-preview.log 2>&1 &
          node tools/run_browser_suite.mjs --suite ${{ matrix.suite }} --shard ${{ matrix.shard }}/${{ matrix.shards }}
