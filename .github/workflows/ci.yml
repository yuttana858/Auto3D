name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check_licenses
      - run: npm run audit_prod
      - run: npm test
      - run: npm run lint_mcp
      - run: npm run test_mcp
      - name: Committed MCP command catalog matches the registry
        run: git diff --exit-code mcp/command-catalog.js website/assets/commands.json
      - name: Verify audience-sharing database permissions and throttling
        shell: bash
        run: |
          set -euo pipefail
          for script in test/security/audience-bootstrap.sql supabase/migrations/20261020223655_audience_library_sharing.sql test/security/audience-access.sql; do
            docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -v ON_ERROR_STOP=1 < "$script"
          done
      - run: npm --prefix backend test
      - run: npm run build_engine
      - run: npm run build_engine_module
      - run: npm run build_website

  browser:
    # Real-browser regressions listed in test/browser/ci-suite.txt; add a test there once it passes reliably.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Software-GPU tests are slow on hosted runners, so the suite is split across parallel shards.
    name: browser (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Expose Chromium where the browser tests expect it
        run: sudo ln -sf "$(node -e "console.log(require('playwright-core').chromium.executablePath())")" /usr/bin/chromium
      - name: Build the dev site, production site, Pages output and MCP workers the regressions load
        run: |
          npm run build_dev
          npm run build_website
          node tools/build_pages.mjs
          node tools/build_mcp_workers.mjs
      - name: Run browser regressions
        shell: bash
        run: |
          npm start > dev-server.log 2>&1 &
          npm run preview_packaging > packaging-preview.log 2>&1 &
          for attempt in $(seq 90); do curl -sf http://127.0.0.1:8080/website/index.html > /dev/null && break; sleep 2; done
          for attempt in $(seq 90); do curl -sf http://127.0.0.1:8082/ > /dev/null && break; sleep 2; done
          mkdir -p work; failed=()
          index=0
          while read -r name; do
            [ -z "$name" ] && continue
            index=$((index + 1))
            [ $(( (index - 1) % 3 + 1 )) -ne ${{ matrix.shard }} ] && continue
            echo "::group::$name"
            # The complete product flow includes many physical-material rebuilds under SwiftShader.
            case "$name" in primary-products) limit=1200 ;; *) limit=600 ;; esac
            timeout "$limit" node "test/browser/$name.mjs" || failed+=("$name")
            echo "::endgroup::"
          done < test/browser/ci-suite.txt
          if [ ${#failed[@]} -gt 0 ]; then echo "Failed: ${failed[*]}"; exit 1; fi
